# Config standalone de agentgateway 1.7.0 (sin Kubernetes) para probar System
# One: JEV (nube) y modelos locales detras del mismo gateway, mas un guardrail
# delante de un modelo real de OpenRouter.
#
# Placeholders que jev_guardrail_agentgateway.py sustituye en tiempo de arranque
# (agentgateway no soporta variables de entorno en el YAML, solo valor inline o
# {file: ruta}). No commitear este fichero con las keys ya sustituidas:
#   __OPENROUTER_API_KEY__  -> la key de OpenRouter (solo el modelo protegido).
#   __TYPESAFE_API_KEY__    -> la key de TypeSafe (JEV nativo).
#   __DB_PATH__             -> ruta al SQLite de log de peticion (ver abajo).
#
# Esquema verificado contra el binario `agentgateway` 1.7.0 con
# `agentgateway --validate-only -f <este fichero renderizado>`.
llm:
  port: 4000
  # Sin esto, el Playground de la propia UI de agentgateway (servida en
  # http://localhost:15000/ui) no puede llamar a /v1/chat/completions desde
  # el navegador: es un origen distinto (15000 vs 4000) y sin CORS explicito
  # el navegador bloquea la peticion con "Browser access is not allowed".
  policies:
    cors:
      allowOrigins:
        - http://localhost:15000
      allowHeaders:
        - '*'
      allowMethods:
        - GET
        - POST
  models:
    - name: openrouter
      provider: openrouter
      overrides:
        # No uses un slug ":free": esos comparten pool y devuelven 429
        # ("temporarily rate-limited upstream") con facilidad. Este es de
        # pago pero muy barato (ver coste por token en openrouter.ai/models).
        # OJO: evita el simbolo de moneda USD seguido de un digito en este
        # fichero YAML, incluso en comentarios: agentgateway hace sustitucion
        # de variables de entorno sobre el texto crudo antes de parsear, y
        # eso rompe el arranque con "environment variable not found".
        model: "openai/gpt-oss-20b"
      auth:
        key:
          value: "__OPENROUTER_API_KEY__"
      guardrails:
        request:
          - webhook:
              target:
                host: localhost:8000
              failureMode: failClosed

    # JEV por la API nativa de TypeSafe. Desde agentgateway 1.7.0 hay un
    # proveedor propio ("typesafe") que habla SystemOne de serie: no hace falta
    # baseUrl ni formats. El gateway registra modelo, tokens y coste. La propia
    # llamada del webhook de guardrail pasa por aqui (mismo patron que el
    # ejemplo oficial agentgateway/examples/llm-guardrail-jev).
    - name: jev
      provider: typesafe
      overrides:
        model: "jev-latest"
      auth:
        key:
          value: "__TYPESAFE_API_KEY__"

    # Modelos locales: servidores propios que implementan /v1/systemone (Laya
    # con laya-serve, Julia-1 con su runtime o con llama-server). Se declaran
    # como proveedor custom con el formato systemOne y la ruta explicita; en la
    # 1.7.0 un custom sin formats ya no acepta /v1/systemone, y sin "path" el
    # gateway envia a otra ruta y el servidor responde 404.
    - name: laya
      provider:
        custom:
          formats:
            - type: systemOne
              path: /v1/systemone
      params:
        baseUrl: http://127.0.0.1:8100
      overrides:
        model: "laya"
    # Mismo servidor, checkpoint multilingue (322M). Laya trata el campo "model"
    # como seleccion de checkpoint: "laya" = ingles, "multilingual" = multilingue.
    - name: laya-ml
      provider:
        custom:
          formats:
            - type: systemOne
              path: /v1/systemone
      params:
        baseUrl: http://127.0.0.1:8100
      overrides:
        model: "multilingual"
    - name: julia
      provider:
        custom:
          formats:
            - type: systemOne
              path: /v1/systemone
      params:
        baseUrl: http://127.0.0.1:8200
      overrides:
        model: "julia"

# Base de datos de logs de peticion (opt-in). Sin esto, las pestanas Logs y
# Analytics de la UI de agentgateway (http://localhost:15000/ui) y el comando
# `agctl standalone analytics` no tienen datos, porque leen las peticiones de
# aqui. __DB_PATH__ es la ruta a un fichero SQLite: segun el esquema del
# binario, cualquier valor que no empiece por postgres:// o postgresql:// se
# trata como SQLite. jev_guardrail_agentgateway.py lo sustituye por
# <repo>/request-logs.db (gitignored).
config:
  # Precios de modelos para el calculo de costes. El gateway ya trae su
  # catalogo; esta fuente en linea anade lo que el catalogo publico no tiene:
  # JEV (proveedor "typesafe") y los modelos locales (proveedor "custom"), estos
  # a coste cero. Precio de JEV: 0,042 por millon de tokens de entrada y salida
  # sin coste, segun la documentacion de OpenRouter (contrastar con TypeSafe: la
  # API nativa no devuelve coste).
  modelCatalog:
    - inline:
        providers:
          typesafe:
            models:
              jev-latest:
                rates: {input: "0.042", output: "0"}
          custom:
            models:
              laya: {rates: {input: "0", output: "0"}}
              multilingual: {rates: {input: "0", output: "0"}}
              julia: {rates: {input: "0", output: "0"}}
  database:
    url: "__DB_PATH__"
